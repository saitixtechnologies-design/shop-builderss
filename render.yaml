# Render Blueprint for the Shop Builder API (server/). Render → New → Blueprint → pick this repo.
# Values marked "sync: false" are secrets: fill them in on Render, never in this file.
# The admin panel (client/) and storefront (frontend/) go on Vercel or Hostinger (docs/DEPLOYMENT.md).
services:
  - type: web
    name: shop-builder-api
    runtime: node
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: TRUST_PROXY
        value: "1"
      - key: DB_SERVER
        sync: false
      - key: DB_PORT
        value: "1433"
      - key: DB_DATABASE
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_ENCRYPT
        value: "Yes"
      - key: DB_TRUST_CERTIFICATE
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM_NAME
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      # Your Vercel addresses, comma-separated, e.g. https://admin.example.vercel.app,https://shops.example.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Shop web addresses (docs/DOMAINS.md): your main domain, and optional Vercel automation
      - key: PLATFORM_DOMAIN
        sync: false
      - key: VERCEL_TOKEN
        sync: false
      - key: VERCEL_PROJECT_ID
        sync: false
      - key: VERCEL_TEAM_ID
        sync: false
